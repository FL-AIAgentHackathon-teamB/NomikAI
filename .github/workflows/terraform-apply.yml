name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to confirm terraform apply'
        required: true
        type: string

env:
  TF_VERSION: '1.7.0'
  WORKING_DIR: './terraform'

jobs:
  terraform-apply:
    name: 🚀 Terraform Apply
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'apply'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_TERRAFORM }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: Terraform Plan
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform plan -no-color -input=false -var="project_id=${{ vars.GCP_PROJECT_ID }}"

      - name: Terraform Apply
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -auto-approve -input=false -var="project_id=${{ vars.GCP_PROJECT_ID }}"

  reject:
    name: ❌ Apply Rejected
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm != 'apply'
    steps:
      - name: Reject
        run: |
          echo "::error::Terraform apply was not confirmed. You must type 'apply' to proceed."
          exit 1
